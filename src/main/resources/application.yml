server:
  port: ${PORT:8081}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/}
      database: journal-app
      auto-index-creation: true
      repositories:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs